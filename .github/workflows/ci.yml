name: Plugins CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - '**.x-dev'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: matomo-org/plugin-ci-workflows/.github/workflows/plugin-ci.yml@main
    with:
      plugin-name: ClassicFontTheme
      verify-hook: true
      # 5.x-dev ships no PHP, only a stylesheet, so there is nothing for these two to scan.
      skip-phpstan: true
      skip-license-check: true
